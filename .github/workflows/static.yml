name: Build and deploy static site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".well-known/**"
      - "images/**"
      - ".github/workflows/static.yml"
      - "index.html"
      - "works/**"
      - "posts.js"
      - "site.js"
      - "images/**"
      - "scripts/get-commit-date.js"
      - "scripts/generate-rss.js"
      - "scripts/stamp-post-dates.js"
      - "style.css"
      - ".nojekyll"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate RSS and prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          node scripts/stamp-post-dates.js
          cp posts.js dist/posts.js
          node scripts/generate-rss.js dist/rss.xml
          if ! git diff --quiet -- posts.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.js
            git commit -m "Assign publication dates to new posts"
            git push
          fi
          cp index.html site.js style.css CNAME .nojekyll dist/
          cp -R works .well-known dist/
          if [ -d images ]; then cp -R images dist/images; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
