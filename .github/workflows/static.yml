name: Build and deploy static site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "assets/**"
      - ".well-known/**"
      - "scripts/**"
      - ".github/workflows/static.yml"
      - "style.css"
      - "search.js"
      - "package.json"
      - "package-lock.json"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate site and feeds
        run: npm run check
        env:
          BASE_PATH: /
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
