name: Build and deploy static site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".well-known/**"
      - "images/**"
      - ".github/workflows/static.yml"
      - "index.html"
      - "works/**"
      - "posts.js"
      - "site.js"
      - "images/**"
      - "scripts/generate-rss.js"
      - "style.css"
      - ".nojekyll"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate RSS and prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html posts.js site.js style.css CNAME .nojekyll dist/
          cp -R works .well-known dist/
          if [ -d images ]; then cp -R images dist/images; fi
          node scripts/generate-rss.js dist/rss.xml
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
